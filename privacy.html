  <h1>隱私權政策</h1>
  <p>ITRI ECG Upload 僅用於將 ITRI ECG App 產生的量測資料檔案（CSV）上傳至研究團隊所擁有的 Google Drive 資料夾。</p>
  <h2>存取的資料</h2>
  <p>本應用程式使用 Google Drive API 建立檔案，僅用於上傳量測資料，不會讀取、修改或刪除使用者雲端硬碟中的其他檔案。</p>
  <h2>資料使用與分享</h2>
  <p>上傳的資料僅供研究團隊內部使用，不會出售或提供給任何第三方。</p>
  <h2>聯絡方式</h2>
  <p>如有任何問題，請聯絡：tinahonwy@gmail.com</p>
